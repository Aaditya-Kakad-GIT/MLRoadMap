<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ML Roadmap — Revised Edition // Adi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-base:#0f0f0f;
    --navy-surface:#1a1a1a;
    --paper:#ffffff;
    --paper-dim:#e8e8e8;
    --ink:#ffffff;
    --ink-soft:#b0b0b0;
    --accent-teal:#00d9ff;
    --accent-dark:#00a8cc;
    --accent-light:rgba(0, 217, 255, 0.1);
    --line:rgba(255,255,255,0.15);
    --line-soft:rgba(255,255,255,0.08);
    --success:#10b981;
    --alert:#f59e0b;
    --font-mono:'JetBrains Mono', monospace;
    --font-display:'Space Mono', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  body{
    background-color:var(--navy-base);
    background-image:none;
    color:var(--paper);
    line-height: 1.6;
    font-family:var(--font-mono);
    font-size:14px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  .app-shell{ max-width:1000px; margin:0 auto; padding:40px 24px 80px; }
  h1,h2,h3{ font-family:var(--font-display); margin:0; font-weight:700; letter-spacing:-0.02em; }
  button{ font-family:var(--font-mono); cursor:pointer; }
  input, textarea{ font-family:var(--font-mono); }
  :focus-visible{ outline:2px solid var(--accent-teal); outline-offset:2px; }
  ::selection{ background:var(--accent-teal); color:#fff; }

  /* ── scrollbar (webkit) ── */
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:var(--navy-base); }
  ::-webkit-scrollbar-thumb{ background:var(--navy-surface); border-radius:0px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--accent-dark); }

  /* ── progress ── */
  .progress-track{ flex:1; height:6px; background:rgba(255,255,255,0.08); border-radius:0px; overflow:hidden; min-width:80px; }
  .progress-fill{ height:100%; background:var(--accent-teal); border-radius:0px; transition:width 0.2s linear; }
  .progress-fill.green{ background:var(--success); }

  /* ── title block ── */
  .titleblock{ border:1px solid var(--line); background:var(--navy-surface); border-radius:0px; padding:20px; margin-bottom:20px; }
  .rev-badge{ display:inline-block; font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; background:var(--accent-teal); color:var(--navy-base); padding:4px 8px; border-radius:0px; margin-bottom:12px; }
  .tb-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .tb-cell{ display:flex; flex-direction:column; gap:4px; }
  .tb-label{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#8b949e; }
  .tb-value{ font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--paper); }
  .tb-progress-row{ display:flex; align-items:center; gap:12px; margin-top:16px; }
  .tb-progress-label{ font-family:var(--font-mono); font-size:10px; color:#8b949e; white-space:nowrap; }
  .tb-progress-text{ font-family:var(--font-mono); font-size:11px; color:var(--paper); white-space:nowrap; }
  .tb-note{ margin:12px 0 0; font-size:12px; color:#8b949e; line-height:1.6; }
  .tb-note strong{ color:var(--accent-teal); }

  /* ── panels ── */
  .panel{ background:var(--navy-surface); color:var(--paper); border-radius:0px; padding:18px; margin-bottom:16px; border-left:3px solid var(--accent-teal); }
  .panel.green-border{ border-left-color:var(--success); }
  .eyebrow{ display:block; font-family:var(--font-mono); font-size:9px; letter-spacing:0.15em; text-transform:uppercase; color:var(--accent-teal); margin-bottom:8px; }

  /* ── this week panel ── */
  .thisweek h2{ font-size:18px; color:var(--paper); margin-bottom:8px; }
  .thisweek.complete{ border-left-color:var(--success); }
  .thisweek-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .tag{ font-family:var(--font-mono); font-size:10px; background:rgba(255,255,255,0.08); color:var(--paper); padding:3px 6px; border-radius:0px; border:1px solid var(--line); }
  .tag.new-tag{ background:rgba(45,212,191,0.12); color:var(--accent-teal); border:1px solid var(--accent-teal); }
  .deliverable{ font-size:13px; color:#8b949e; margin:0 0 12px; }
  .thisweek-bottom{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .mini-stat{ font-family:var(--font-mono); font-size:11px; color:#8b949e; }

  /* ── badges ── */
  .badge{ font-family:var(--font-mono); font-size:10px; padding:3px 8px; border-radius:0px; white-space:nowrap; border:1px solid; }
  .badge.st-ontrack{ background:rgba(52,211,153,0.12); color:var(--success); border-color:var(--success); }
  .badge.st-behind{ background:rgba(248,113,113,0.12); color:var(--alert); border-color:var(--alert); }
  .badge.st-skipped{ background:rgba(248,113,113,0.12); color:var(--alert); border-color:var(--alert); }
  .badge.st-none{ background:rgba(255,255,255,0.05); color:#8b949e; border-color:var(--line); }

  /* ── buttons ── */
  .btn-primary{ border:1px solid var(--accent-teal); background:var(--accent-teal); color:var(--navy-base); font-size:12px; font-weight:600; padding:8px 14px; border-radius:0px; margin-left:auto; transition:background 0.1s linear, border-color 0.1s linear; }
  .btn-primary:hover{ background:var(--accent-dark); border-color:var(--accent-dark); }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-secondary{ border:1px solid var(--line); background:transparent; color:var(--paper); font-size:11px; font-weight:600; padding:6px 12px; border-radius:0px; transition:background 0.1s linear, border-color 0.1s linear; }
  .btn-secondary:hover{ background:rgba(255,255,255,0.08); border-color:var(--accent-teal); }

  /* ── DSA parallel track ── */
  .dsa-panel{ background:var(--navy-surface); color:var(--paper); border-radius:0px; padding:16px; margin-bottom:16px; display:grid; grid-template-columns:1fr 1fr; gap:16px; border-left:3px solid var(--success); border-radius:0px; }
  .dsa-col{ display:flex; flex-direction:column; gap:8px; }
  .dsa-col + .dsa-col{ border-left:1px solid var(--line); padding-left:16px; }
  .dsa-label{ font-family:var(--font-mono); font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent-teal); margin-bottom:4px; }
  .dsa-controls{ display:flex; align-items:center; gap:8px; }
  .step-btn{ width:28px; height:28px; border:1px solid var(--line); background:transparent; color:var(--paper); border-radius:0px; font-size:14px; line-height:1; transition:background 0.1s linear, border-color 0.1s linear; }
  .step-btn:hover{ background:rgba(255,255,255,0.08); border-color:var(--accent-teal); }
  .num-input{ width:64px; text-align:center; font-family:var(--font-mono); font-size:14px; font-weight:600; border:1px solid var(--line); border-radius:0px; padding:6px 4px; background:transparent; color:var(--paper); }
  .num-input:focus{ border-color:var(--accent-teal); outline:none; }
  .dsa-target{ font-family:var(--font-mono); font-size:11px; color:#8b949e; }
  .dsa-note{ font-size:12px; color:#8b949e; line-height:1.5; }

  /* ── growth track (CS fundamentals / outreach / applications) ── */
  .growth-panel{ background:var(--navy-surface); color:var(--paper); border-radius:0px; padding:16px; margin-bottom:16px; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; border-left:3px solid var(--accent-teal); }
  .growth-col{ display:flex; flex-direction:column; gap:8px; }
  .growth-col + .growth-col{ border-left:1px solid var(--line); padding-left:16px; }
  .growth-label{ font-family:var(--font-mono); font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent-teal); margin-bottom:4px; }

  /* ── resources panel ── */
  .resources-panel{ background:var(--navy-surface); color:var(--paper); border-radius:0px; margin-bottom:16px; border-left:3px solid var(--accent-teal); overflow:hidden; }
  .resources-toggle{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px; cursor:pointer; user-select:none; transition:background 0.1s linear; }
  .resources-toggle:hover{ background:rgba(255,255,255,0.05); }
  .resources-toggle h2{ font-size:15px; color:var(--paper); font-weight:700; letter-spacing:-0.01em; }
  .resources-toggle-meta{ display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:11px; color:#8b949e; white-space:nowrap; flex-shrink:0; }
  .resources-toggle-meta .chevron{ color:#8b949e; transition:transform 0.15s linear; }
  .resources-toggle[aria-expanded="true"] .chevron{ transform:rotate(90deg); }
  .resources-body{ display:none; padding:0 18px 18px; border-top:1px solid var(--line); }
  .resources-body.open{ display:block; padding-top:16px; }

  .res-search-wrap{ position:relative; margin-bottom:16px; }
  .res-search-icon{ position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:12px; color:#8b949e; pointer-events:none; }
  .res-search{ width:100%; padding:8px 10px 8px 28px; border:1px solid var(--line); border-radius:0px; font-size:12px; color:var(--paper); background:transparent; transition:border-color 0.1s linear; }
  .res-search:focus{ border-color:var(--accent-teal); outline:none; box-shadow:0 0 0 2px var(--accent-light); }

  .res-group{ margin-bottom:16px; }
  .res-group:last-child{ margin-bottom:0; }
  .res-group.res-hidden{ display:none; }
  .res-group-title{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent-teal); padding-bottom:6px; margin-bottom:8px; border-bottom:1px solid var(--line); }
  .res-group-count{ font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:0; text-transform:none; color:#8b949e; background:rgba(255,255,255,0.05); padding:2px 6px; border-radius:0px; border:1px solid var(--line); }
  .res-group-items{ display:flex; flex-direction:column; gap:6px; }

  .res-item{ display:flex; align-items:flex-start; gap:10px; padding:8px; border-radius:0px; cursor:pointer; transition:background 0.1s linear; border:1px solid transparent; }
  .res-item:hover{ background:rgba(255,255,255,0.05); border-color:var(--line); }
  .res-item.res-hidden{ display:none; }
  .res-item input{ margin-top:3px; flex-shrink:0; width:16px; height:16px; accent-color:var(--accent-teal); cursor:pointer; }
  .res-item-body{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .res-item-body a{ font-size:12px; font-weight:600; color:var(--accent-teal); text-decoration:none; word-break:break-word; }
  .res-item-body a:hover{ text-decoration:underline; }
  .res-link-icon{ font-size:10px; color:#8b949e; margin-left:3px; display:inline-block; }
  .res-item-meta{ font-family:var(--font-mono); font-size:10px; color:#8b949e; }
  .res-item.done .res-item-body a{ color:#8b949e; text-decoration:line-through; text-decoration-color:var(--line); }
  .res-item.done .res-item-meta{ color:#8b949e; }
  .res-item.done{ background:rgba(52,211,153,0.08); border-color:rgba(52,211,153,0.2); }

  .res-empty{ display:none; text-align:center; font-size:12px; color:#8b949e; padding:16px 0; }
  .res-empty.show{ display:block; }
  .res-summary{ font-size:11px; color:#8b949e; line-height:1.6; margin:16px 0 0; padding-top:12px; border-top:1px solid var(--line); }

  /* ── phase sections ── */
  .phase-section{ margin-top:32px; margin-bottom:16px; }
  .phase-header{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; border-bottom:1px solid var(--line); padding-bottom:12px; }
  .phase-heading{ display:flex; align-items:baseline; gap:8px; }
  .phase-code{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.12em; color:var(--accent-teal); }
  .phase-header h3{ font-size:16px; color:var(--paper); }
  .phase-time{ font-family:var(--font-mono); font-size:11px; color:#8b949e; }
  .phase-goal{ font-size:12px; color:#8b949e; max-width:700px; margin:10px 0 12px; line-height:1.6; }
  .phase-progress-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .phase-progress-text{ font-family:var(--font-mono); font-size:10px; color:#8b949e; white-space:nowrap; }

  /* ── exit panel ── */
  .exit-toggle{ display:inline-block; background:transparent; border:1px solid var(--line); color:var(--paper); font-size:11px; padding:6px 10px; border-radius:0px; margin-bottom:6px; transition:border-color 0.1s linear; }
  .exit-toggle:hover{ border-color:var(--accent-teal); }
  .exit-panel{ display:none; margin:10px 0 16px; padding:12px; background:rgba(255,255,255,0.02); border:1px solid var(--line); border-radius:0px; }
  .exit-panel.open{ display:block; }
  .exit-item{ display:flex; align-items:flex-start; gap:10px; padding:6px 0; font-size:12px; color:var(--paper); }
  .exit-item input{ margin-top:3px; flex-shrink:0; width:16px; height:16px; accent-color:var(--accent-teal); }

  /* ── entry cards ── */
  .entry-list{ display:flex; flex-direction:column; gap:8px; }
  .entry{ background:transparent; color:var(--paper); border-radius:0px; overflow:hidden; border:1px solid var(--line); transition:border-color 0.1s linear, background 0.1s linear; }
  .entry.open{ border-color:var(--accent-teal); background:rgba(45,212,191,0.08); }
  .entry-header{ display:flex; align-items:center; gap:12px; padding:12px; cursor:pointer; }
  .entry-header:hover{ background:rgba(255,255,255,0.03); }
  .entry-code{ font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--accent-teal); flex-shrink:0; width:60px; }
  .entry-titlewrap{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .entry-date{ font-family:var(--font-mono); font-size:10px; color:#8b949e; }
  .entry-title{ font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--paper); }
  .now-tag{ font-family:var(--font-mono); font-size:8px; background:var(--accent-teal); color:var(--navy-base); padding:2px 6px; border-radius:0px; margin-left:6px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; vertical-align:middle; }
  .new-feature-tag{ font-family:var(--font-mono); font-size:8px; background:rgba(45,212,191,0.2); color:var(--accent-teal); border:1px solid var(--accent-teal); padding:2px 5px; border-radius:0px; margin-left:5px; vertical-align:middle; }
  .chevron{ font-size:16px; color:#8b949e; transition:transform 0.15s linear; flex-shrink:0; }
  .entry.open .chevron{ transform:rotate(90deg); }
  .entry-body{ display:none; padding:0 12px 12px; border-top:1px solid var(--line); }
  .entry.open .entry-body{ display:block; padding-top:12px; }
  .entry-note{ font-size:11px; border-left:2px solid var(--accent-teal); padding-left:10px; background:rgba(45,212,191,0.08); padding:8px 10px; border-radius:0px; margin:0 0 12px; color:#8b949e; }
  .entry-note.warn{ border-left-color:var(--alert); background:rgba(248,113,113,0.08); }
  .entry-deliverable{ font-size:12px; color:#8b949e; margin:0 0 12px; }

  /* ── task list ── */
  .task-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .task-item{ display:flex; align-items:flex-start; gap:10px; font-size:12px; }
  .task-item input{ margin-top:2px; flex-shrink:0; width:16px; height:16px; accent-color:var(--accent-teal); }
  .task-item span.new-item{ color:var(--accent-teal); font-style:italic; }
  .task-progress{ font-family:var(--font-mono); font-size:10px; color:#8b949e; margin:0 0 16px; }

  /* ── check-in ── */
  .checkin{ border-top:1px solid var(--line); padding-top:12px; }
  .checkin-label{ display:block; font-family:var(--font-mono); font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:#8b949e; margin-bottom:8px; }
  .pill-group{ display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .pill{ border:1px solid var(--line); background:transparent; color:var(--paper); font-size:11px; padding:6px 11px; border-radius:0px; cursor:pointer; transition:border-color 0.1s linear, background 0.1s linear; }
  .pill:hover{ border-color:var(--accent-teal); background:rgba(45,212,191,0.08); }
  .pill.active{ background:var(--accent-teal); color:var(--navy-base); border-color:var(--accent-teal); font-weight:600; }
  textarea[data-action="notes"]{ width:100%; min-height:64px; resize:vertical; border:1px solid var(--line); border-radius:0px; padding:8px 10px; font-size:12px; color:var(--paper); background:transparent; margin-bottom:10px; }
  textarea[data-action="notes"]:focus{ border-color:var(--accent-teal); box-shadow:0 0 0 2px var(--accent-light); outline:none; }
  .save-row{ display:flex; align-items:center; gap:10px; }
  .saved-msg{ font-family:var(--font-mono); font-size:10px; color:var(--success); opacity:0; transition:opacity 0.2s ease; }
  .saved-msg.show{ opacity:1; }

  /* ── footer ── */
  .footer-row{ display:flex; justify-content:space-between; align-items:center; margin-top:40px; padding-top:16px; border-top:1px solid var(--line); }
  .save-status{ font-family:var(--font-mono); font-size:10px; color:#8b949e; }
  .reset-btn{ background:transparent; border:1px solid var(--line); color:#8b949e; font-size:11px; padding:6px 11px; border-radius:0px; transition:border-color 0.1s linear, color 0.1s linear; }
  .reset-btn:hover{ border-color:var(--alert); color:var(--alert); }
  .loading-note{ font-family:var(--font-mono); font-size:12px; color:#8b949e; padding:40px 0; text-align:center; }

  /* ── responsive ── */
  @media (max-width:768px){
    .app-shell{ padding:24px 16px 56px; }
    .tb-grid{ grid-template-columns:repeat(2, 1fr); }
    .dsa-panel{ grid-template-columns:1fr; }
    .dsa-col + .dsa-col{ border-left:none; border-top:1px solid var(--line); padding-left:0; padding-top:12px; }
    .growth-panel{ grid-template-columns:1fr; }
    .growth-col + .growth-col{ border-left:none; border-top:1px solid var(--line); padding-left:0; padding-top:12px; }
    .entry-header{ flex-wrap:wrap; }
    .entry-code{ width:auto; }
    .resources-toggle{ padding:14px 16px; }
    .resources-body{ padding:0 16px 16px; }
    .resources-body.open{ padding-top:14px; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="app-shell">
<!-- PERSONALIZED ROADMAP DASHBOARD - DYNAMIC DATES -->
<style>
  .dashboard { 
    margin-bottom: 64px; 
    padding-bottom: 48px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
  
  .dashboard-header {
    margin-bottom: 48px;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(0, 217, 255, 0.2);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  
  .dashboard-title-group {
    flex: 1;
  }
  
  .dashboard-title { 
    font-family: var(--font-display); 
    font-size: clamp(2.5rem, 6vw, 4rem); 
    font-weight: 700; 
    color: #00d9ff;
    line-height: 1.2;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
  }
  
  .dashboard-subtitle { 
    font-size: 14px; 
    color: #888888;
    font-family: var(--font-mono);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  
  .skip-day-btn {
    background: linear-gradient(135deg, rgba(0, 217, 255, 0.2) 0%, rgba(0, 217, 255, 0.1) 100%);
    border: 1px solid rgba(0, 217, 255, 0.4);
    color: #00d9ff;
    padding: 12px 20px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 200ms ease;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  
  .skip-day-btn:hover {
    background: linear-gradient(135deg, rgba(0, 217, 255, 0.3) 0%, rgba(0, 217, 255, 0.2) 100%);
    border-color: rgba(0, 217, 255, 0.6);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(0, 217, 255, 0.2);
  }
  
  .skip-day-btn:active {
    transform: translateY(0);
  }
  
  /* Stats Section */
  .stats-grid { 
    display: grid; 
    grid-template-columns: repeat(3, 1fr); 
    gap: 24px; 
    margin-bottom: 48px; 
  }
  
  .stat-card { 
    background: linear-gradient(135deg, rgba(26, 26, 26, 0.9) 0%, rgba(26, 26, 26, 0.6) 100%);
    backdrop-filter: blur(20px);

<div class="dashboard">
  <div class="dashboard-header">
    <div class="dashboard-title-group">
      <div class="dashboard-title">ML Internship</div>
      <div class="dashboard-subtitle">26-week learning journey</div>
    </div>
    <button class="skip-day-btn" id="skipDayBtn">Skip Day</button>
  </div>
  
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="completedWeeks">5/26</div>
      <div class="stat-label">Completed</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="remainingWeeks">21</div>
      <div class="stat-label">Remaining</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="finishDate">Jan 12</div>
      <div class="stat-label">Target Date</div>
    </div>
  </div>
  
  <div class="progress-bar-container">
    <div class="progress-bar-label">Overall Progress</div>
    <div class="progress-bar">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="progress-info">
      <span>~110 hours completed</span>
      <span>~410 hours remaining</span>
    </div>
  </div>
  
  <div style="margin-bottom: 48px;">
    <div class="section-title">Learning Timeline</div>
    <div class="timeline-container" id="timelineContainer">
      <!-- Generated by JavaScript -->
    </div>
  </div>
  
  <div>
    <div class="section-title">Week Overview</div>
    <div class="calendar-grid" id="calendarGrid">
      <!-- Generated by JavaScript -->
    </div>
    <div class="calendar-legend">
      <div class="legend-item">
        <div class="legend-box current"></div>
        <span>Current & Active</span>
      </div>
      <div class="legend-item">
        <div class="legend-box break"></div>
        <span>Exam Breaks</span>
      </div>
    </div>
  </div>
</div>

<script>
  class RoadmapTracker {
    constructor() {
      this.baseStartDate = new Date(2026, 7, 20); // Aug 20, 2026
      this.loadSkipDays();
      this.setupPhases();
      this.render();
      this.setupEventListeners();
    }
    
    loadSkipDays() {
      const saved = localStorage.getItem('roadmapSkipDays');
      this.skipDays = saved ? parseInt(saved) : 0;
    }
    
    saveSkipDays() {
      localStorage.setItem('roadmapSkipDays', this.skipDays);
    }
    
    getStartDate() {
      const date = new Date(this.baseStartDate);
      date.setDate(date.getDate() + this.skipDays);
      return date;
    }
    
    addDays(date, days) {
      const result = new Date(date);
      result.setDate(result.getDate() + days);
      return result;
    }
    
    formatDate(date) {
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return months[date.getMonth()] + ' ' + date.getDate();
    }
    
    setupPhases() {
      const start = this.getStartDate();
      
      this.phases = [
        { name: 'Weeks 1–5', weeks: 5, startOffset: -35, label: '✓ Weeks 1–5', type: 'past', detail: 'Foundation Sprint: Linear algebra, Python, NumPy, Pandas, DSA. Strong base for ML.' },
        { name: 'Weeks 6–12', weeks: 7, startOffset: 0, label: '→ Weeks 6–12 • Active Now', type: 'active', detail: 'Core ML fundamentals: Supervised learning, model evaluation, scikit-learn projects. Building real skills.' },
        { name: 'PT1 Break', weeks: 2, startOffset: 49, label: '⊘ PT1 Exam Break', type: 'break', detail: '1 week review + exam week (Oct 15–19). Resume ML on Oct 20.' },
        { name: 'Weeks 13–15', weeks: 3, startOffset: 63, label: 'Weeks 13–15', type: 'normal', detail: 'Core ML + Project 1: Credit Card Fraud Detection. End-to-end pipeline with real data.' },
        { name: 'Practical Exams', weeks: 1, startOffset: 84, label: '⊘ Practical Exams', type: 'break', detail: 'Hands-on lab assessments. No ML coursework this week—focus on exams.' },
        { name: 'Week 16', weeks: 1, startOffset: 91, label: 'Week 16', type: 'normal', detail: 'Unsupervised learning: Clustering, dimensionality reduction, anomaly detection.' },
        { name: 'Term-End', weeks: 3, startOffset: 98, label: '⊘ Term-End Exams', type: 'break', detail: 'PT2 exam (Dec 1–8) + college finals. Full review period—no new ML content.' },
        { name: 'Weeks 17–21', weeks: 5, startOffset: 119, label: '🎯 Weeks 17–21 • Sprint', type: 'normal', detail: 'Neural Networks, Transformers, LLMs. Complete Project 2. Strong finish to roadmap.' }
      ];
      
      this.phases.forEach(phase => {
        phase.startDate = this.addDays(start, phase.startOffset);
        phase.endDate = this.addDays(phase.startDate, phase.weeks * 7 - 1);
      });
      
      const finalEnd = this.phases[this.phases.length - 1].endDate;
      this.finishDate = finalEnd;
    }
    
    render() {
      this.renderTimeline();
      this.renderCalendar();
      this.updateStats();
      this.animateProgressBar();
    }
    
    renderTimeline() {
      const container = document.getElementById('timelineContainer');
      container.innerHTML = '';
      
      const now = this.getStartDate();
      
      this.phases.forEach(phase => {
        const isCompleted = now > phase.endDate;
        const isActive = now >= phase.startDate && now <= phase.endDate;
        
        const item = document.createElement('div');
        item.className = `timeline-item ${phase.type} ${isActive ? 'active' : ''} ${isCompleted ? 'past' : ''}`;
        
        const dateStr = `${this.formatDate(phase.startDate)} — ${this.formatDate(phase.endDate)}`;
        const weekStr = phase.weeks > 1 ? `(${phase.weeks} weeks)` : '(1 week)';
        
        item.innerHTML = `
          <div class="timeline-header">
            <div class="timeline-content">
              <div class="timeline-label">${phase.label}</div>
              <div class="timeline-dates">${dateStr} ${weekStr}</div>
            </div>
            <div class="timeline-toggle">+</div>
          </div>
          <div class="timeline-detail">${phase.detail}</div>
        `;
        
        const toggle = item.querySelector('.timeline-toggle');
        const detail = item.querySelector('.timeline-detail');
        
        if (phase.type === 'past' || isActive) {
          detail.classList.add('open');
          toggle.classList.add('rotated');
        }
        
        item.querySelector('.timeline-header').addEventListener('click', () => {
          detail.classList.toggle('open');
          toggle.classList.toggle('rotated');
        });
        
        container.appendChild(item);
      });
    }
    
    renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';
      
      const now = this.getStartDate();
      let weekNum = 6;
      
      this.phases.forEach(phase => {
        const daysInPhase = phase.weeks * 7;
        
        for (let i = 0; i < daysInPhase; i += 7) {
          const weekStart = this.addDays(phase.startDate, i);
          const isCompleted = now > weekStart;
          const isCurrent = now.toDateString() === weekStart.toDateString() || 
                           (now > weekStart && now < this.addDays(weekStart, 7));
          
          const week = document.createElement('div');
          week.className = `calendar-week ${phase.type === 'break' ? 'break' : ''} ${isCurrent ? 'current' : ''} ${isCompleted ? 'past' : ''}`;
          week.textContent = phase.type === 'break' ? (weekNum === 6 ? 'BR' : 'PT1' || 'PE' || 'TR' || 'EX') : 'W' + weekNum;
          
          grid.appendChild(week);
          if (phase.type !== 'break') weekNum++;
        }
      });
    }
    
    updateStats() {
      const now = this.getStartDate();
      let completed = 0;
      let remaining = 26;
      
      this.phases.forEach(phase => {
        if (phase.type !== 'break' && now > phase.endDate) {
          completed += phase.weeks;
          remaining -= phase.weeks;
        }
      });
      
      document.getElementById('completedWeeks').textContent = completed + '/26';
      document.getElementById('remainingWeeks').textContent = remaining;
      document.getElementById('finishDate').textContent = this.formatDate(this.finishDate);
    }
    
    animateProgressBar() {
      const now = this.getStartDate();
      let progressPercent = 0;
      
      this.phases.forEach(phase => {
        if (phase.type !== 'break') {
          if (now > phase.endDate) {
            progressPercent += (phase.weeks / 26) * 100;
          }
        }
      });
      
      const progressFill = document.querySelector('.progress-bar-fill');
      progressFill.style.width = progressPercent + '%';
    }
    
    skipDay() {
      this.skipDays++;
      this.saveSkipDays();
      this.setupPhases();
      this.render();
    }
    
    setupEventListeners() {
      document.getElementById('skipDayBtn').addEventListener('click', () => {
        this.skipDay();
      });
    }
  }
  
  // Initialize on load
  window.addEventListener('DOMContentLoaded', () => {
    new RoadmapTracker();
  });
</script>
</body>
